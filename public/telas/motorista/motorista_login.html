<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do motorista | Rodrigo Táxi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/telas/telas.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/comum.js"></script>
</head>

<body class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <div id="nav"></div>

            <h1 class="h3 mt-4 mb-4">Bem-vindo, motorista! Realize seu login para acessar suas informações!</h1>

            <div id="alerta" class="alert d-none" role="alert"></div>

            <form class="row g-4" id="formLogin">
                <div class="col-12">
                    <label class="form-label" for="telefone">Seu WhatsApp (com DDD)</label>
                    <input class="form-control" id="telefone" type="tel" placeholder="(21) 99999-9999"
                        autocomplete="username" required>
                </div>
                <div class="col-12">
                    <label class="form-label" for="senha">Senha</label>
                    <input class="form-control" id="senha" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary col-12" type="submit" id="botao">Entrar</button>
            </form>
            <p class="mt-3"><a href="motorista_cadastro.html">Não possuo conta</a></p>
        </div>
    </div>

    <script>
        document.getElementById("nav").innerHTML = NAV_MOTORISTA;
        const alerta = document.getElementById("alerta");
        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault();
            const botao = document.getElementById("botao");
            botao.disabled = true;
            try {
                await api("/api/motorista/login", {
                    method: "POST",
                    corpo: { telefone: document.getElementById("telefone").value, senha: document.getElementById("senha").value },
                });
                location.href = "motorista.html";
            } catch (err) {
                mostraAlerta(alerta, err.message);
                botao.disabled = false;
            }
        });
    </script>
</body>

</html>

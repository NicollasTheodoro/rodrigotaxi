<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de motorista | Rodrigo Táxi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/telas/telas.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/js/comum.js"></script>
</head>

<body class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <div id="nav"></div>

            <h1 class="h3 mt-4 mb-4">Bem-vindo, motorista! Realize seu cadastro para iniciar sua jornada conosco!</h1>

            <div id="alerta" class="alert d-none" role="alert"></div>

            <form class="row g-3" id="formCadastro">
                <div class="col-12">
                    <label class="form-label" for="nome">Seu nome</label>
                    <input class="form-control" id="nome" type="text" placeholder="Marcos da Silva" maxlength="60"
                        autocomplete="name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="telefone">Seu WhatsApp (com DDD)</label>
                    <input class="form-control" id="telefone" type="tel" placeholder="(21) 99999-9999"
                        autocomplete="tel" required>
                    <div class="form-text">As solicitações dos passageiros chegarão nesse número.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="senha">Senha (mín. 6 caracteres)</label>
                    <input class="form-control" id="senha" type="password" minlength="6" autocomplete="new-password"
                        required>
                </div>
                <div id="perfil" class="row g-3 m-0 p-0"></div>
                <button class="btn btn-primary col-12" type="submit" id="botao">Enviar cadastro</button>
            </form>
            <p class="mt-3"><a href="motorista_login.html">Já tenho conta</a></p>
        </div>
    </div>

    <script>
        document.getElementById("nav").innerHTML = NAV_MOTORISTA;
        document.getElementById("perfil").innerHTML = camposPerfilHTML();
        preencherPerfil({});
        let foto = null;
        ligarFoto((f) => (foto = f));

        const alerta = document.getElementById("alerta");
        document.getElementById("formCadastro").addEventListener("submit", async (e) => {
            e.preventDefault();
            const botao = document.getElementById("botao");
            botao.disabled = true;
            alerta.classList.add("d-none");
            try {
                await api("/api/motoristas", {
                    method: "POST",
                    corpo: {
                        nome: document.getElementById("nome").value,
                        telefone: document.getElementById("telefone").value,
                        senha: document.getElementById("senha").value,
                        ...lerPerfil(),
                        foto,
                    },
                });
                document.getElementById("formCadastro").classList.add("d-none");
                mostraAlerta(alerta, "Cadastro enviado! Ele será analisado e, depois de aprovado, você aparecerá para os passageiros. Você já pode entrar com seu telefone e senha.", "success");
            } catch (err) {
                mostraAlerta(alerta, err.message);
                alerta.scrollIntoView({ behavior: "smooth" });
                botao.disabled = false;
            }
        });
    </script>
</body>

</html>
